repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [--fix]
        # These exact copied runtime sources retain their reviewed bytes.
        # Custody/import guards and secret/history checks still scan them.
        exclude: &checked_reference_python >-
          (?x)^formal/tools/(?:
          boschloo|metered_algebraic|metered_boschloo_polynomials|
          metered_global_geometry|metered_global_producer|metered_isolate|
          metered_localize|metered_parametric|metered_polynomial|metered_root|
          metered_selected_refinement|metered_specialized|resource_model
          )\.py$
      - id: ruff-format
        exclude: *checked_reference_python
