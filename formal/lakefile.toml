name = "ExactCIsFormal"
version = "0.1.0"
keywords = ["statistics", "exact-inference", "formal-verification"]
defaultTargets = ["ExactCIs.Unconditional.MeteredGlobalChecker"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "CarfSpine"

[[lean_lib]]
name = "ExactCIs"
