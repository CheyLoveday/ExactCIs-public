[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "exactcis"
dynamic = ["version"]
description = "Design-aware inference for sparse 2x2 tables"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Chey Loveday", email = "cheyloveday@users.noreply.github.com" },
]
keywords = [
  "statistics",
  "confidence intervals",
  "contingency tables",
  "biostatistics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "mypy==1.19.1",
  "pytest>=8.4,<9",
  "pytest-cov>=7.1,<8",
  "ruff==0.15.12",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.6",
]
release = [
  "build==1.4.4",
  "twine==6.2.0",
]
security = [
  "detect-secrets==1.5.0",
  "pip-audit==2.9.0",
]
validation = [
  "mpmath==1.3.0",
]

[tool.hatch.version]
path = "src/exactcis/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exactcis"]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/.pre-commit-config.yaml",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CITATION.txt",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/docs_md",
  "/examples",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["exactcis"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/exactcis"]
warn_unreachable = true

[tool.uv]
required-version = ">=0.12.1,<0.13"
