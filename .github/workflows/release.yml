name: Authorised package release

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Existing candidate tag to verify and release
        required: true
        default: v1.1.1
        type: string
      release_authorisation:
        description: Type release-v1.1.1-through-testpypi
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exactcis-release
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify authorization, tag, and release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Refuse an unconfigured or unapproved dispatch
        shell: bash
        env:
          ENABLED: ${{ vars.EXACTCIS_RELEASE_WORKFLOW_ENABLED }}
          AUTHORISATION: ${{ inputs.release_authorisation }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true"
          test "$AUTHORISATION" = "release-v1.1.1-through-testpypi"
      - name: Check out the requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - name: Verify an exact clean tagged commit
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF_NAME}" = "$CANDIDATE_TAG"
          test "$(git rev-list -n 1 "$CANDIDATE_TAG")" = "$(git rev-parse HEAD)"
          test "$(git describe --tags --exact-match HEAD)" = "$CANDIDATE_TAG"
          test -z "$(git status --porcelain=v1)"
      - run: uv sync --frozen --extra dev --extra docs --extra release
      - name: Verify version, tag, changelog, citations, and workflow input
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: uv run python tools/check_version_consistency.py --release-tag "$CANDIDATE_TAG"

  quality:
    name: Release quality gates
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev --extra docs --extra security
      - run: uv run ruff check src tests examples tools
      - run: uv run ruff format --check src tests examples tools
      - run: uv run mypy src/exactcis
      - run: uv run mkdocs build --strict
      - run: uv run python tools/check_method_docs.py
      - run: uv run python tools/check_capability_docs.py --check
      - run: uv run python tools/check_doc_version_references.py
      - run: uv run python tools/check_public_tree.py
      - run: uv run python tools/audit_dependencies.py
      - run: uv run python tools/check_history_secrets.py
      - run: uv run python tools/check_repository_hygiene.py
      - run: uv run python tools/run_readme_examples.py --source README.md

  test-platforms:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --tb=short

  build:
    name: Build one verified release bundle
    needs: [quality, test-platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra release
      - run: uv run python -m build --outdir release-bundle/dist
      - run: uv run python -m twine check release-bundle/dist/*
      - run: uv run python tools/check_distribution_contents.py release-bundle/dist/*
      - name: Record artefact checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release-bundle/dist/* > release-bundle/SHA256SUMS
          cat release-bundle/SHA256SUMS
      - name: Upload the sole promotion bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  artifact-smoke:
    name: Smoke-test ${{ matrix.kind }} independently
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify and install one artefact
        shell: bash
        env:
          ARTEFACT_KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          sha256sum --check release-bundle/SHA256SUMS
          if [[ "$ARTEFACT_KIND" = "wheel" ]]; then
            artefacts=(release-bundle/dist/*.whl)
          else
            artefacts=(release-bundle/dist/*.tar.gz)
          fi
          test "${#artefacts[@]}" -eq 1
          python -m venv "$RUNNER_TEMP/exactcis-$ARTEFACT_KIND-venv"
          smoke_python="$RUNNER_TEMP/exactcis-$ARTEFACT_KIND-venv/bin/python"
          "$smoke_python" -m pip install --disable-pip-version-check "${artefacts[0]}"
          "$smoke_python" -m pip check
          smoke_dir="$RUNNER_TEMP/exactcis-$ARTEFACT_KIND-smoke"
          mkdir "$smoke_dir"
          cp README.md tools/run_installed_smoke.py tools/run_readme_examples.py "$smoke_dir/"
          cd "$smoke_dir"
          "$smoke_python" run_installed_smoke.py
          "$smoke_python" run_readme_examples.py --source README.md

  ordered-preflight-evidence:
    name: Archive ordered preflight cap evidence
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Measure installed-wheel ordered preflight
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release-bundle/SHA256SUMS
          artefacts=(release-bundle/dist/*.whl)
          test "${#artefacts[@]}" -eq 1
          wheel_sha256=$(sha256sum "${artefacts[0]}" | awk '{print $1}')
          python -m venv "$RUNNER_TEMP/exactcis-ordered-preflight-venv"
          evidence_python="$RUNNER_TEMP/exactcis-ordered-preflight-venv/bin/python"
          "$evidence_python" -m pip install --disable-pip-version-check "${artefacts[0]}"
          "$evidence_python" -m pip check
          evidence_dir="$RUNNER_TEMP/exactcis-ordered-preflight-evidence"
          mkdir "$evidence_dir"
          cp tools/ordered_preflight_evidence.py "$evidence_dir/"
          cd "$evidence_dir"
          "$evidence_python" ordered_preflight_evidence.py \
            --json ordered-preflight-evidence.json \
            --artifact-sha256 "$wheel_sha256"
      - name: Archive ordered preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ordered-preflight-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/exactcis-ordered-preflight-evidence/ordered-preflight-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish verified bundle to TestPyPI
    needs: [artifact-smoke, ordered-preflight-evidence]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/exactcis/
    permissions:
      contents: read
      id-token: write # OIDC is used only for TestPyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify promotion inputs
        run: sha256sum --check release-bundle/SHA256SUMS
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-bundle/dist
          skip-existing: false

  testpypi-smoke:
    name: Install the exact TestPyPI candidate
    needs: publish-testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Install by exact version and wheel hash with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release-bundle/SHA256SUMS
          candidate_version=$(python -c 'namespace = {}; exec(open("src/exactcis/__about__.py", encoding="utf-8").read(), namespace); print(namespace["__version__"])')
          wheel_hash=$(awk '$2 ~ /[.]whl$/ {print $1}' release-bundle/SHA256SUMS)
          test -n "$wheel_hash"
          printf 'exactcis==%s --hash=sha256:%s\n' "$candidate_version" "$wheel_hash" > "$RUNNER_TEMP/testpypi-requirement.txt"
          python -m venv "$RUNNER_TEMP/exactcis-testpypi-venv"
          testpypi_python="$RUNNER_TEMP/exactcis-testpypi-venv/bin/python"
          installed=false
          for delay in 0 10 20 30 45 60; do
            if [[ "$delay" -gt 0 ]]; then sleep "$delay"; fi
            if "$testpypi_python" -m pip install --disable-pip-version-check --no-deps --require-hashes --index-url https://test.pypi.org/simple/ --requirement "$RUNNER_TEMP/testpypi-requirement.txt"; then
              installed=true
              break
            fi
          done
          test "$installed" = "true"
          "$testpypi_python" -m pip check
          cd "$RUNNER_TEMP"
          "$testpypi_python" "$GITHUB_WORKSPACE/tools/run_installed_smoke.py"

  publish-pypi:
    name: Manually approve and promote identical files to PyPI
    needs: testpypi-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exactcis/
    permissions:
      contents: read
      id-token: write # OIDC is used only for PyPI trusted publishing.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify unchanged promotion inputs
        run: sha256sum --check release-bundle/SHA256SUMS
      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist
          skip-existing: false

  github-release:
    name: Create the GitHub release last
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only to create the final GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle
      - name: Verify files and create release with checksums
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check release-bundle/SHA256SUMS
          {
            cat CHANGELOG.md
            printf '\n## Release provenance\n\n'
            printf 'Release revision: %s\n\n' "$(git rev-list -n 1 "$CANDIDATE_TAG")"
            printf 'Artefact SHA-256:\n\n```text\n'
            cat release-bundle/SHA256SUMS
            printf '```\n'
          } > release-bundle/RELEASE_NOTES.md
          gh release create "$CANDIDATE_TAG" \
            release-bundle/dist/* \
            release-bundle/SHA256SUMS \
            --verify-tag \
            --title "ExactCIs $CANDIDATE_TAG" \
            --notes-file release-bundle/RELEASE_NOTES.md
